<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartWash Pro</title>
    <style>
        :root { --primary: #ff6b00; --bg: #f8f9fa; --danger: #ff3b30; --success: #34c759; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); color: #333; -webkit-tap-highlight-color: transparent; }
        .setup-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; display: flex; flex-direction: column; padding: 40px 30px; box-sizing: border-box; }
        .hidden { display: none !important; }
        .btn { width: 100%; padding: 18px; border-radius: 20px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; }
        .btn-main { background: var(--primary); color: white; }
        .header { background: linear-gradient(135deg, var(--primary), #ff8c00); color: white; padding: 45px 20px 25px; border-radius: 0 0 25px 25px; text-align: center; }
        .content { padding: 20px; }
        .card { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 15px; margin-bottom: 10px; cursor: pointer; }
        .card.active { border-color: var(--primary); background: #fff9f5; }
        #ticket { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 3000; padding: 40px 25px; box-sizing: border-box; text-align: center; overflow-y: auto; }
        input, select { width: 100%; padding: 18px; border-radius: 15px; border: 2px solid #eee; margin-bottom: 15px; box-sizing: border-box; font-size: 16px; }
    </style>
</head>
<body>

    <div id="step1" class="setup-screen hidden">
        <h1>Tere!</h1>
        <p>Sisesta oma nimi.</p>
        <input type="text" id="setup-name" placeholder="Sinu nimi">
        <button class="btn btn-main" onclick="saveName()">Jätka</button>
    </div>

    <div id="main-app" class="hidden">
        <div class="header"><h2 id="greet">Tere!</h2></div>
        <div class="content">
            <h3>Vali asukoht</h3>
            <div class="card active" id="st-info">Pärnu Ülejõe Circle K</div>
            <h3>Vali auto</h3>
            <select id="car-select"><option>123 ABC</option><option>999 XYZ</option></select>
            <button class="btn btn-main" onclick="makeBooking()">Broneeri 18€</button>
            <button class="btn" style="background:#eee; margin-top:20px;" onclick="resetApp()">Logi välja / Nulli</button>
        </div>
    </div>

    <div id="ticket">
        <h1>Pilet kinnitatud!</h1>
        <div style="font-size: 50px;">🧼</div>
        <p id="ticket-det"></p>
        <button class="btn btn-main" style="background:#007aff" onclick="startNav()">📍 Ava navigatsioon</button>
        <button class="btn" onclick="closeTicket()">Tagasi äppi</button>
        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">
        <button class="btn" style="color:var(--danger); background:none;" onclick="cancelBooking()">Tühista broneering (50% tagastus)</button>
    </div>

    <script>
        // 1. KONTROLLI MÄLU ÄPI AVAMISEL
        window.onload = function() {
            if (localStorage.getItem('userName')) {
                showMain();
                if (localStorage.getItem('hasBooking')) showTicket(false);
            } else {
                document.getElementById('step1').classList.remove('hidden');
            }
        };

        function saveName() {
            const val = document.getElementById('setup-name').value;
            if(!val) return;
            localStorage.setItem('userName', val);
            showMain();
        }

        function showMain() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('greet').innerText = "Tere, " + localStorage.getItem('userName') + "!";
        }

        function makeBooking() {
            localStorage.setItem('hasBooking', 'true');
            showTicket(true);
        }

        function showTicket(isNew) {
            document.getElementById('ticket-det').innerText = "Sinu broneering jaamas: \n" + document.getElementById('st-info').innerText;
            document.getElementById('ticket').style.display = 'block';
        }

        function closeTicket() {
            document.getElementById('ticket').style.display = 'none';
        }

        function cancelBooking() {
            if(confirm("Kas soovid tühistada? Tagastame 50% summast.")) {
                localStorage.removeItem('hasBooking');
                location.reload();
            }
        }

        function startNav() {
            // MUUDATUS: Avab uues aknas, et äpp ei sulguks
            const addr = "Ehitajate tee 4, Pärnu";
            window.open("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(addr), '_blank');
        }

        function resetApp() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
